<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchpad Pro MK3 - MLRvst Interactive Map</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --lp-case: #1e293b;
            --lp-border: #334155;
            --pad-off: #334155;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glow-cyan: #06b6d4;
            --glow-magenta: #ec4899;
            --glow-blue: #3b82f6;
            --glow-green: #10b981;
            --glow-yellow: #f59e0b;
            --glow-red: #ef4444;
            --glow-orange: #f97316;
            --glow-purple: #a855f7;
            --tooltip-bg: rgba(15, 23, 42, 0.95);
            --tooltip-border: rgba(56, 189, 248, 0.5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-dim);
            margin: 0;
        }

        .device {
            background: var(--lp-case);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            border: 2px solid var(--lp-border);
            display: grid;
            gap: 20px;
            grid-template-areas:
                ". t t t t t t t t ."
                ". tx tx tx tx tx tx tx tx ."
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                "l g g g g g g g g r"
                ". b b b b b b b b ."
                "s c c c c c c c c .";
            position: relative;
        }

        .pad-group {
            display: contents;
        }

        .pad {
            background: var(--pad-off);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 600;
            width: 60px;
            height: 60px;
            color: white;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            word-break: break-word;
            padding: 2px;
            border: 1px solid rgba(0,0,0,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            position: relative;
            box-sizing: border-box;
        }

        /* Pad shapes */
        .pad.rect-h { height: 35px; border-radius: 8px; }
        .pad.rect-v { width: 60px; height: 60px; border-radius: 30px; } /* Circular/pill for sides */
        .pad.circle { width: 60px; height: 60px; border-radius: 50%; }

        /* Generic glows */
        .pad.active {
            transform: scale(0.95);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .pad:hover {
            filter: brightness(1.2);
        }

        /* Specific modes for top buttons */
        .top-row-btn[data-mode="Standard"] { border-bottom: 3px solid rgba(255,255,255,0.3); }
        .top-row-btn[data-mode="Record"] { border-bottom: 3px solid var(--glow-red); }
        .top-row-btn[data-mode="Pattern"] { border-bottom: 3px solid var(--glow-blue); }
        .top-row-btn[data-mode="Stutter"] { border-bottom: 3px solid var(--glow-magenta); }
        .top-row-btn[data-mode="Macro1"] { border-bottom: 3px solid var(--glow-cyan); }
        .top-row-btn[data-mode="Macro2"] { border-bottom: 3px solid var(--glow-orange); }
        .top-row-btn[data-mode="Macro3"] { border-bottom: 3px solid var(--glow-green); }
        .top-row-btn[data-mode="Macro4"] { border-bottom: 3px solid var(--glow-purple); }
        .top-row-btn[data-mode="MashUp"] { border-bottom: 3px solid var(--text-main); }

        .legend {
            margin-top: 2rem;
            max-width: 800px;
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .legend h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.2rem;
        }

        /* Tooltip styles */
        #tooltip {
            position: fixed;
            background: var(--tooltip-bg);
            color: var(--text-main);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--tooltip-border);
            max-width: 280px;
            font-size: 0.85rem;
            line-height: 1.4;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        #tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #tooltip strong {
            display: block;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.25rem;
        }

        #tooltip .related {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Launchpad Pro MK3 — Mode Explorer</h1>
        <p>Interactive layout mapping for MLRvst. Click a mode button on the Top Row to explore!</p>
        <p style="font-size: 0.85em; color: var(--glow-cyan); margin-top: 5px;">Hover over any pad to see detailed information.</p>
    </header>

    <div class="device" id="device">
        <!-- Generated by JS -->
    </div>

    <div class="legend" id="legend">
        <h2>Mode Details</h2>
        <p id="legend-desc">Select a mode from the top row to see how the layout updates.</p>
    </div>

    <!-- The floating tooltip bubble -->
    <div id="tooltip"></div>

    <script>
        const device = document.getElementById('device');
        const legendDesc = document.getElementById('legend-desc');
        const tooltip = document.getElementById('tooltip');

        let tooltipTimeout;

        // Default mappings for Aux Rows if current Mode doesn't override them
        const defaultTAux = (i) => ['FX1', 'FX2', 'FX3', 'Mod Panel', 'Smp Prv', 'Smp Nxt', 'Smp Rnd', 'Simil Bwsr'][i];
        const defaultTAuxColor = '#475569';
        const defaultTAuxTip = (i) => {
            const labels = ['FX Slot 1', 'FX Slot 2', 'FX Slot 3', 'Modulator Panel', 'Previous Sample', 'Next Sample', 'Random Sample', 'Similarity Browser'];
            return `<strong>Top Aux ${i} [CC 101-108]</strong>Triggers standard function: ${labels[i]}.<div class="related"><em>Requires:</em> Select a strip on the LSB column first to apply this to the desired channel.</div>`
        };

        const defaultBAux = (i) => `Snap ${i}`;
        const defaultBAuxColor = '#475569';
        const defaultBAuxTip = (i) => `<strong>Bottom Aux ${i} [CC 1-8]</strong>Loads FX Snapshot ${i} for the currently selected FX slot.<div class="related"><em>Shift:</em> Shift + Tap saves the current FX state into Snapshot ${i}.</div>`;

        const modeDefinitions = {
            'Standard': {
                desc: '<strong>Standard Mode</strong>: The basic layout. The 8x8 Grid represents 6 Strips (rows 0-5) × 8 Slices (cols 0-7). Rows 6-7 are expression pads.',
                color: 'var(--pad-off)',
                grid: (r, c) => r < 6 ? `S${r}<br>Slc ${c}` : `Expr<br>Row ${r}`,
                gridColor: (r, c) => r < 6 ? '#2563eb' : '#475569',
                gridTip: (r, c) => r < 6 ? 
                    `<strong>Strip ${r}, Slice ${c}</strong>Triggers audio slice ${c} for Strip ${r}. Playback follows the strip quantization.<div class="related"><em>Related:</em> Use LSB ${r} to select this strip for parameters. Group cycle on RSB ${r}.</div>` : 
                    `<strong>Expression Row ${r}</strong>Used for poly pressure/aftertouch routing to selected modules. Sends raw velocity data.`,
                
                lsb: (r) => `Select<br>Strip ${r}`,
                lsbColor: '#10b981',
                lsbTip: (r) => `<strong>Select Strip ${r}</strong>Makes Strip ${r} active. The auxiliary buttons (T.Aux and B.Aux below) will now target Strip ${r}'s parameters.`,

                rsb: (r) => `Group<br>Cycle ${r}`,
                rsbColor: '#f59e0b',
                rsbTip: (r) => `<strong>Cycle Group ${r}</strong>Toggles playing/stopped state for all strips assigned to Group ${r}.`,
            },
            'Record': {
                desc: '<strong>Record Mode (CC 91)</strong>: Arms live audio recording. First empty strip shows a Bar-Length selector. Other existing strips show playback.',
                color: 'var(--glow-red)',
                grid: (r, c) => {
                    if (r === 0) {
                        const bars = [1,2,4,8,16,32,64,'Man'];
                        return `Bar len<br>${bars[c]}`;
                    }
                    if (r === 1) return `Armed<br>Record`;
                    return 'Idle / Play';
                },
                gridColor: (r, c) => r === 0 ? '#64748b' : (r === 1 ? '#b91c1c' : '#334155'),
                gridTip: (r, c) => {
                    if (r === 0) {
                        const bars = [1,2,4,8,16,32,64,'Manual'];
                        return `<strong>Bar Length: ${bars[c]}</strong>Selects the length of the recording loop for the new strip. When 'Manual', stops only when pressed again.<div class="related"><em>Works with:</em> RSB to arm recording.</div>`;
                    }
                    if (r === 1) return `<strong>Recording Armed</strong>Waiting for the first audio transient or immediate capture (depending on threshold settings).`;
                    return `<strong>Playback status</strong>Shows activity for already recorded strips. Overwrite not supported directly here.`;
                },
                
                lsb: (r) => 'Select / Clear',
                lsbColor: '#ef4444',
                lsbTip: (r) => `<strong>Clear / Select Strip ${r}</strong>Double tap to clear the audio buffer from this strip. Single tap selects it.`,

                rsb: (r) => 'Arm / Stop',
                rsbColor: '#f87171',
                rsbTip: (r) => `<strong>Record Arm ${r}</strong>Arms Strip ${r} for live audio capture. The grid immediately changes to show Bar-Length selection on an empty row!`,
            },
            'Pattern': {
                desc: '<strong>Pattern Mode (CC 92)</strong>: 8x8 Grid becomes a Step Sequencer. Columns = Steps (0-7). Rows = Slices inverted (Top row = Slice 7, Bottom = Slice 0). LSB arms group recording.',
                color: 'var(--glow-blue)',
                grid: (r, c) => `Step ${c}<br>Slc ${7-r}`,
                gridColor: (r, c) => r%2===0 ? '#3b82f6' : '#2563eb',
                gridTip: (r, c) => `<strong>Sequence Step ${c} -> Slice ${7-r}</strong>Programs the step sequencer so Step ${c} plays Slice ${7-r}. <div class="related"><em>Remember:</em> Slices go from 0 (bottom row) to 7 (top row) to feel like a pitch-sequencer. LSB arms the sequence recorder.</div>`,
                
                lsb: (r) => `Rec Arm<br>Grp ${r}`,
                lsbColor: '#f59e0b',
                lsbTip: (r) => `<strong>Record Arm Pattern Group ${r}</strong>Starts sequentially recording your pad presses into the pattern step sequence for Group ${r}.`,

                rsb: (r) => `Retired`,
                rsbColor: '#334155',
                rsbTip: (r) => `<strong>Retired Function</strong>Unused in Pattern Mode.`,

                tAux: (i) => `Page ${i+1}`,
                tAuxColor: '#0ea5e9',
                tAuxTip: (i) => `<strong>Page Nav: ${i+1}</strong>Jumps to page ${i+1} of the pattern. <div class="related"><em>Shift:</em> Shift + tap sets the length of the pattern to ${i+1} pages.</div>`,

                bAux: (i) => `Slot ${i}`,
                bAuxColor: '#10b981',
                bAuxTip: (i) => `<strong>Activate Slot ${i}</strong>Activates this slot for sequential playback. <div class="related"><em>Shift:</em> Shift+Tap selects for edit. Shift+Double-Tap clears it entirely!</div>`
            },
            'Stutter': {
                desc: '<strong>Stutter Mode (CC 93)</strong>: Grid still triggers slices, but holding a pad engages momentary stutter. RSB changes the stutter division.',
                color: 'var(--glow-magenta)',
                grid: (r, c) => r < 6 ? `Stutter<br>S${r} C${c}` : `(unused)`,
                gridColor: (r, c) => r < 6 ? '#c026d3' : '#334155',
                gridTip: (r, c) => r < 6 ? 
                    `<strong>Stutter Strip ${r}, Slice ${c}</strong>While held, rapidly repeats Slice ${c} at the division set by the RSB. Releasing resumes normal play.<div class="related"><em>Requires:</em> RSB button selection to define the speed.</div>` : 
                    `<strong>Unused Row</strong>`,
                
                lsb: (r) => `Select<br>Strip ${r}`,
                lsbColor: '#10b981',
                lsbTip: (r) => `<strong>Select Strip ${r}</strong>Standard strip focus selection.`,

                rsb: (r) => {
                    const divs = ['1/1', '1/2', '1/4', '1/8', '1/16', '1/32', '1/64', '1/128'];
                    return `Div<br>${divs[r]}`;
                },
                rsbColor: '#f472b6',
                rsbTip: (r) => {
                    const divs = ['1/1', '1/2', '1/4', '1/8', '1/16', '1/32', '1/64', '1/128'];
                    return `<strong>Stutter Division: ${divs[r]}</strong>Sets the looping division for any stutters triggered on the main grid.`;
                },
            },
            'Macro1': {
                desc: '<strong>Macro 1 Seq (CC 94)</strong>: Step-sequence the Macro 1 value. Row 0 = Playhead trigger. Rows 1-7 = VU value bars.',
                color: 'var(--glow-cyan)',
                grid: (r, c) => r === 0 ? `Play<br>Col ${c}` : `Val ${7-r}`,
                gridColor: (r, c) => r === 0 ? '#f8fafc' : (r > 7/2 ? '#06b6d4' : '#0891b2'),
                gridTip: (r, c) => r === 0 ? 
                    `<strong>Play Step ${c}</strong>Triggers playback of the Macro Sequence from step ${c}.` : 
                    `<strong>Set Step ${c} Value to ${7-r}</strong>Sets the amplitude/VU parameter for Step ${c} of this Macro. Taller = Higher Value.`,
                
                lsb: (r) => `Select<br>Strip ${r}`,
                lsbColor: '#10b981',
                lsbTip: (r) => `<strong>Select Strip ${r}</strong>Changes which strip the macro parameters map to.`,

                rsb: (r) => `(unused)`,
                rsbColor: '#334155',
                rsbTip: (r) => `<strong>Unused Function</strong>`,
            },
            'MashUp': {
                desc: '<strong>Mash-up Mode (CC 98)</strong>: A global overlay. Rows 0-2 = Strip Switch. Row 4 = Global Switch. Rows 5-7 = FX sequencers.',
                color: '#ffffff',
                grid: (r, c) => {
                    if (r===0) return `S${c} Nxt`;
                    if (r===1) return `S${c} Rnd`;
                    if (r===2) return `S${c} Prv`;
                    if (r===3) return `(unused)`;
                    if (r===4) return c===0?'Prv All':(c===3?'Rnd All':(c===7?'Nxt All':''));
                    if (r===5) return `FX1 S.${c}`;
                    if (r===6) return `FX2 S.${c}`;
                    if (r===7) return `FX3 S.${c}`;
                },
                gridColor: (r, c) => {
                    if (r<3) return '#fbbf24';
                    if (r===4) return '#94a3b8';
                    if (r===5) return '#ef4444';
                    if (r===6) return '#3b82f6';
                    if (r===7) return '#10b981';
                    return '#334155';
                },
                gridTip: (r, c) => {
                    if (r===0) return `<strong>Next Slice (Strip ${c})</strong>Jumps Strip ${c} to the mathematically next slice in sequence.`;
                    if (r===1) return `<strong>Random Slice (Strip ${c})</strong>Jumps Strip ${c} to a pseudo-random slice instantly.`;
                    if (r===2) return `<strong>Previous Slice (Strip ${c})</strong>Jumps Strip ${c} to the mathematically previous slice.`;
                    if (r===3) return `<strong>Unused Space</strong>`;
                    if (r===4) return c===0?`<strong>Previous All</strong>Trigger Prev Slice across all playing strips.`:(c===3?`<strong>Random All</strong>Trigger Random Slice across all playing strips.`:(c===7?`<strong>Next All</strong>Trigger Next Slice across all playing strips.`:`Unused`));
                    if (r===5) return `<strong>FX 1 Sequencer Step ${c}</strong>Toggles FX 1 on/off for this step across the master sequence.`;
                    if (r===6) return `<strong>FX 2 Sequencer Step ${c}</strong>Toggles FX 2 on/off for this step across the master sequence.`;
                    if (r===7) return `<strong>FX 3 Sequencer Step ${c}</strong>Toggles FX 3 on/off for this step across the master sequence.`;
                },
                
                lsb: (r) => `Select<br>Strip ${r}`,
                lsbColor: '#10b981',
                lsbTip: (r) => `<strong>Select Strip ${r}</strong>Functions normally underneath the MashUp overlay.`,

                rsb: (r) => `Group<br>Cycle ${r}`,
                rsbColor: '#f59e0b',
                rsbTip: (r) => `<strong>Group Cycle ${r}</strong>Functions normally underneath the MashUp overlay.`,
            }
        };

        const topModes = [
            { id: 'Record', label: 'Rec', color: 'var(--glow-red)' },
            { id: 'Pattern', label: 'Patt', color: 'var(--glow-blue)' },
            { id: 'Stutter', label: 'Stut', color: 'var(--glow-magenta)' },
            { id: 'Macro1', label: 'Mac1', color: 'var(--glow-cyan)' },
            { id: 'Macro2', label: 'Mac2', color: 'var(--glow-orange)' },
            { id: 'Macro3', label: 'Mac3', color: 'var(--glow-green)' },
            { id: 'Macro4', label: 'Mac4', color: 'var(--glow-purple)' },
            { id: 'MashUp', label: 'Mash', color: '#ffffff' }
        ];

        let currentMode = 'Standard';

        function showTooltip(e, content) {
            clearTimeout(tooltipTimeout);
            tooltipTimeout = setTimeout(() => {
                tooltip.innerHTML = content;
                tooltip.classList.add('visible');
                
                // Positioning logic matching the window bounds
                const x = e.clientX;
                const y = e.clientY;
                const w = window.innerWidth;
                const h = window.innerHeight;
                
                let tx = x + 15;
                let ty = y + 15;

                // Adjust if overflowing
                if (tx + tooltip.offsetWidth > w) tx = x - tooltip.offsetWidth - 15;
                if (ty + tooltip.offsetHeight > h) ty = y - tooltip.offsetHeight - 15;

                tooltip.style.left = `${tx}px`;
                tooltip.style.top = `${ty}px`;
            }, 350); // 350ms hover delay
        }

        function hideTooltip() {
            clearTimeout(tooltipTimeout);
            tooltip.classList.remove('visible');
        }

        function addTooltipEvents(element, contentGetter) {
            element.addEventListener('mouseenter', (e) => {
                const content = contentGetter();
                if(content && content !== '') showTooltip(e, content);
            });
            element.addEventListener('mousemove', (e) => {
                if (tooltip.classList.contains('visible')) {
                    // Update tip position slightly if we are moving inside
                    const x = e.clientX;
                    const y = e.clientY;
                    let tx = x + 15;
                    let ty = y + 15;
                    
                    if (tx + tooltip.offsetWidth > window.innerWidth) tx = x - tooltip.offsetWidth - 15;
                    if (ty + tooltip.offsetHeight > window.innerHeight) ty = y - tooltip.offsetHeight - 15;

                    tooltip.style.left = `${tx}px`;
                    tooltip.style.top = `${ty}px`;
                }
            });
            element.addEventListener('mouseleave', hideTooltip);
        }

        function getRenderId() {
            let renderId = currentMode;
            if(['Macro2','Macro3','Macro4'].includes(currentMode)) renderId = 'Macro1';
            return renderId;
        }

        // Initialize DOM Elements
        function buildLayout() {
            // Top Row
            topModes.forEach((mode, i) => {
                const btn = document.createElement('div');
                btn.className = 'pad rect-h top-row-btn';
                btn.dataset.mode = mode.id;
                btn.innerHTML = mode.label;
                btn.style.gridColumn = `${i + 2}`;
                btn.style.gridRow = `1`;
                btn.onclick = () => setMode(currentMode === mode.id ? 'Standard' : mode.id);
                
                addTooltipEvents(btn, () => `<strong>Mode: ${mode.id}</strong>Click to toggle this mode lock. Top row handles global interaction layout.<div class="related"><em>Note:</em> In MLRvst, returning to 'Standard' puts focus back on basic slice triggering.</div>`);

                device.appendChild(btn);
            });

            // Top Aux Row (Below grid)
            for(let i=0; i<8; i++) {
                const btn = document.createElement('div');
                btn.className = `pad rect-h t-aux-pad p${i}`;
                btn.style.gridColumn = `${i + 2}`;
                btn.style.gridRow = `11`;
                
                addTooltipEvents(btn, () => {
                    const renderId = getRenderId();
                    return modeDefinitions[renderId]?.tAuxTip ? modeDefinitions[renderId].tAuxTip(i) : defaultTAuxTip(i);
                });
                
                device.appendChild(btn);
            }

            // Central Grid (8x8)
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const btn = document.createElement('div');
                    btn.className = `pad grid-pad r${r} c${c}`;
                    btn.style.gridColumn = `${c + 2}`;
                    btn.style.gridRow = `${r + 3}`;
                    
                    addTooltipEvents(btn, () => {
                        const renderId = getRenderId();
                        return modeDefinitions[renderId]?.gridTip ? modeDefinitions[renderId].gridTip(r, c) : '';
                    });

                    device.appendChild(btn);
                }
            }

            // LSB Row
            for(let r=0; r<8; r++) {
                const btn = document.createElement('div');
                btn.className = `pad rect-v lsb-pad r${r}`;
                btn.style.gridColumn = `1`;
                btn.style.gridRow = `${r + 3}`;
                
                addTooltipEvents(btn, () => {
                    const renderId = getRenderId();
                    return modeDefinitions[renderId]?.lsbTip ? modeDefinitions[renderId].lsbTip(r) : '';
                });

                device.appendChild(btn);
            }

            // RSB Row
            for(let r=0; r<8; r++) {
                const btn = document.createElement('div');
                btn.className = `pad rect-v rsb-pad r${r}`;
                btn.style.gridColumn = `10`;
                btn.style.gridRow = `${r + 3}`;
                
                addTooltipEvents(btn, () => {
                    const renderId = getRenderId();
                    return modeDefinitions[renderId]?.rsbTip ? modeDefinitions[renderId].rsbTip(r) : '';
                });

                device.appendChild(btn);
            }

            // Bottom Aux Row
            for(let i=0; i<8; i++) {
                const btn = document.createElement('div');
                btn.className = `pad rect-h b-aux-pad p${i}`;
                btn.style.gridColumn = `${i + 2}`;
                btn.style.gridRow = `12`;
                
                addTooltipEvents(btn, () => {
                    const renderId = getRenderId();
                    return modeDefinitions[renderId]?.bAuxTip ? modeDefinitions[renderId].bAuxTip(i) : defaultBAuxTip(i);
                });

                device.appendChild(btn);
            }

            // Shift
            const shiftBtn = document.createElement('div');
            shiftBtn.className = 'pad rect-h';
            shiftBtn.innerHTML = 'Shift';
            shiftBtn.style.gridColumn = `1`;
            shiftBtn.style.gridRow = `12`;
            
            addTooltipEvents(shiftBtn, () => `<strong>Shift Key</strong>Held down in conjunction with Aux keys or Grid keys to access deeper setup menus, preset swapping, or secondary track states.`);

            device.appendChild(shiftBtn);
        }

        function setMode(modeId) {
            currentMode = modeId;
            
            let renderId = getRenderId();
            const def = modeDefinitions[renderId];
            if (!def) return; // Fallback

            // Update mode description
            legendDesc.innerHTML = `<span style="font-size:1.1em; color:${topModes.find(m=>m.id===modeId)?.color || '#fff'}">${modeId}</span> <br/> ` +
                 (modeDefinitions[modeId] ? modeDefinitions[modeId].desc : def.desc);

            // Update top row highlight
            document.querySelectorAll('.top-row-btn').forEach(btn => {
                if(btn.dataset.mode === modeId) {
                    btn.style.backgroundColor = topModes.find(m=>m.id === modeId).color;
                    btn.style.color = '#000';
                    btn.style.boxShadow = `0 0 15px ${topModes.find(m=>m.id === modeId).color}`;
                } else {
                    btn.style.backgroundColor = 'var(--pad-off)';
                    btn.style.color = 'white';
                    btn.style.boxShadow = 'none';
                }
            });

            // Update LSB
            document.querySelectorAll('.lsb-pad').forEach((btn, r) => {
                btn.innerHTML = def.lsb(r);
                btn.style.backgroundColor = def.lsbColor;
                btn.style.boxShadow = `0 0 10px ${def.lsbColor}40`;
            });

            // Update RSB
            document.querySelectorAll('.rsb-pad').forEach((btn, r) => {
                btn.innerHTML = def.rsb(r);
                btn.style.backgroundColor = def.rsbColor;
                btn.style.boxShadow = `0 0 10px ${def.rsbColor}40`;
            });

            // Update Center Grid
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const btn = document.querySelector(`.grid-pad.r${r}.c${c}`);
                    btn.innerHTML = def.grid(r, c);
                    btn.style.backgroundColor = def.gridColor(r, c);
                    if(def.gridColor(r,c) !== '#334155' && def.gridColor(r,c) !== '#475569') {
                        btn.style.boxShadow = `0 0 15px ${def.gridColor(r, c)}80`;
                    } else {
                        btn.style.boxShadow = 'none';
                    }
                }
            }

            // Update Aux Rows
            for(let i=0; i<8; i++) {
                // T.Aux
                const tBtn = document.querySelector(`.t-aux-pad.p${i}`);
                tBtn.innerHTML = def.tAux ? def.tAux(i) : defaultTAux(i);
                tBtn.style.backgroundColor = def.tAuxColor ? def.tAuxColor : defaultTAuxColor;
                tBtn.style.boxShadow = (def.tAuxColor && def.tAuxColor !== '#475569') ? `0 0 10px ${def.tAuxColor}40` : 'none';

                // B.Aux
                const bBtn = document.querySelector(`.b-aux-pad.p${i}`);
                bBtn.innerHTML = def.bAux ? def.bAux(i) : defaultBAux(i);
                bBtn.style.backgroundColor = def.bAuxColor ? def.bAuxColor : defaultBAuxColor;
                bBtn.style.boxShadow = (def.bAuxColor && def.bAuxColor !== '#475569') ? `0 0 10px ${def.bAuxColor}40` : 'none';
            }
        }

        buildLayout();
        setMode('Standard');
    </script>
</body>
</html>
